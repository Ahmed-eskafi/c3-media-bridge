<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">C3 Media Bridge hardware system flow diagram</title>
<desc id="desc">A flowchart with real product photographs showing a BLE remote connected wirelessly to an ESP32-C3 Super Mini, then by USB data cable to an Android car head unit running the C3 Media Bridge app.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#1d3a59"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#19c6df"/><stop offset="1" stop-color="#547cff"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#59d3ff"/></marker>
 <clipPath id="p1"><rect x="85" y="230" width="290" height="250" rx="16"/></clipPath>
 <clipPath id="p2"><rect x="500" y="230" width="270" height="250" rx="16"/></clipPath>
 <clipPath id="p3"><rect x="915" y="230" width="250" height="250" rx="16"/></clipPath>
 <clipPath id="p4"><rect x="1310" y="230" width="220" height="250" rx="16"/></clipPath>
</defs>
<rect width="1600" height="720" rx="30" fill="url(#bg)"/>
<text x="800" y="76" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">C3 MEDIA BRIDGE</text>
<text x="800" y="116" text-anchor="middle" fill="#bdd3e8" font-family="Arial,sans-serif" font-size="21">HARDWARE CONNECTION &amp; DATA FLOW</text>
<rect x="85" y="150" width="1430" height="3" rx="2" fill="url(#accent)"/>
<!-- node cards -->
<g filter="url(#shadow)">
 <rect x="65" y="195" width="330" height="355" rx="24" fill="#f8fafc"/>
 <rect x="480" y="195" width="310" height="355" rx="24" fill="#f8fafc"/>
 <rect x="895" y="195" width="290" height="355" rx="24" fill="#f8fafc"/>
 <rect x="1290" y="195" width="260" height="355" rx="24" fill="#f8fafc"/>
</g>
<!-- actual component photos -->
<image x="85" y="230" width="290" height="250" preserveAspectRatio="xMidYMid meet" clip-path="url(#p1)" xlink:href="https://i.ebayimg.com/images/g/J5MAAOSwDe9iqC-I/s-l960.jpg"/>
<image x="500" y="230" width="270" height="250" preserveAspectRatio="xMidYMid meet" clip-path="url(#p2)" xlink:href="https://zaitronics.com.au/cdn/shop/files/1-10PCS-ESP32-C3-Development-Board-ESP32-C3-SuperMini-WiFi-4M-Bluetooth-For-Arduino_jpg.png?v=1721795578&amp;width=1445"/>
<image x="915" y="230" width="250" height="250" preserveAspectRatio="xMidYMid meet" clip-path="url(#p3)" xlink:href="https://media.takealot.com/covers_images/4dc2c5e552a04144992f64cb07323f65/s-zoom.file"/>
<image x="1310" y="230" width="220" height="250" preserveAspectRatio="xMidYMid meet" clip-path="url(#p4)" xlink:href="https://raw.githubusercontent.com/Ahmed-eskafi/c3-media-bridge/main/docs/images/mazda-android-head-unit.jpg"/>
<!-- numbered step markers -->
<g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
 <circle cx="91" cy="211" r="22" fill="#177fb5"/><text x="91" y="219" fill="#fff" font-size="21">1</text>
 <circle cx="506" cy="211" r="22" fill="#177fb5"/><text x="506" y="219" fill="#fff" font-size="21">2</text>
 <circle cx="921" cy="211" r="22" fill="#177fb5"/><text x="921" y="219" fill="#fff" font-size="21">3</text>
 <circle cx="1316" cy="211" r="22" fill="#177fb5"/><text x="1316" y="219" fill="#fff" font-size="21">4</text>
</g>
<!-- arrows and connection labels -->
<path d="M397 360H468" stroke="#59d3ff" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
<path d="M792 360H883" stroke="#59d3ff" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
<path d="M1187 360H1278" stroke="#59d3ff" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
<g fill="#9ce7ff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">
 <text x="433" y="325">BLE</text><text x="837" y="325">USB</text><text x="1232" y="325">SERIAL</text>
</g>
<!-- labels under photos -->
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="230" y="515" fill="#142338" font-size="22" font-weight="700">BLE MEDIA REMOTE</text>
 <text x="230" y="538" fill="#51657b" font-size="15">Wireless button commands</text>
 <text x="635" y="515" fill="#142338" font-size="22" font-weight="700">ESP32-C3 SUPER MINI</text>
 <text x="635" y="538" fill="#51657b" font-size="15">Receives BLE • sends serial data</text>
 <text x="1040" y="515" fill="#142338" font-size="22" font-weight="700">USB DATA CABLE</text>
 <text x="1040" y="538" fill="#51657b" font-size="15">USB Serial • 115200 baud</text>
 <text x="1420" y="515" fill="#142338" font-size="20" font-weight="700">ANDROID HEAD UNIT</text>
 <text x="1420" y="538" fill="#51657b" font-size="15">C3 Media Bridge app</text>
</g>
<!-- output -->
<rect x="155" y="590" width="1290" height="78" rx="20" fill="#123b5a" stroke="url(#accent)" stroke-width="2"/>
<text x="800" y="622" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">ANDROID MEDIA ACTIONS</text>
<text x="800" y="650" text-anchor="middle" fill="#d0eaff" font-family="Arial,sans-serif" font-size="19">PLAY / PAUSE   •   NEXT   •   PREVIOUS   •   VOLUME + / −</text>
<text x="800" y="698" text-anchor="middle" fill="#91abc5" font-family="Arial,sans-serif" font-size="13">Representative product photos; exact hardware model may vary.</text>
</svg>