<rect x="125" y="555" width="1190" height="75" rx="20" fill="#123b5a" stroke="url(#line)" stroke-width="2"/>
<text x="720" y="586" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">MEDIA COMMANDS</text>
<text x="720" y="614" fill="#cceaff" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Play / Pause  •  Next  •  Previous  •  Volume + / −</text>
<text x="720" y="668" fill="#91abc5" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Illustrative product photographs; exact appearance may vary by hardware model.</text>
</svg>