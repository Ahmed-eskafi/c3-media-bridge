<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
<title id="title">C3 Media Bridge — real hardware system diagram</title>
<desc id="desc">Photographic system diagram showing a Bluetooth steering wheel media remote sending BLE commands to an ESP32-C3 SuperMini, which sends USB serial commands through a USB cable to an Android car head unit running the C3 Media Bridge app.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1b3550"/></linearGradient>
 <linearGradient id="line" x2="1"><stop stop-color="#36d1dc"/><stop offset="1" stop-color="#4387ff"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#52c8ff"/></marker>
 <clipPath id="remoteClip"><rect x="70" y="205" width="270" height="230" rx="18"/></clipPath>
 <clipPath id="espClip"><rect x="430" y="205" width="250" height="230" rx="18"/></clipPath>
 <clipPath id="cableClip"><rect x="790" y="205" width="230" height="230" rx="18"/></clipPath>
 <clipPath id="headClip"><rect x="1120" y="205" width="250" height="230" rx="18"/></clipPath>
</defs>
<rect width="1440" height="700" rx="30" fill="url(#bg)"/>
<text x="720" y="68" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle">C3 MEDIA BRIDGE</text>
<text x="720" y="106" fill="#b7cbe0" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Real hardware photos • BLE → ESP32-C3 → USB Serial → Android head unit</text>

<!-- cards -->
<g filter="url(#shadow)">
 <rect x="55" y="175" width="300" height="330" rx="24" fill="#f8fafc"/>
 <rect x="415" y="175" width="280" height="330" rx="24" fill="#f8fafc"/>
 <rect x="775" y="175" width="260" height="330" rx="24" fill="#f8fafc"/>
 <rect x="1095" y="175" width="290" height="330" rx="24" fill="#f8fafc"/>
</g>
<!-- real photos -->
<image x="70" y="205" width="270" height="230" preserveAspectRatio="xMidYMid meet" clip-path="url(#remoteClip)" xlink:href="https://i.ebayimg.com/images/g/J5MAAOSwDe9iqC-I/s-l960.jpg"/>
<image x="430" y="205" width="250" height="230" preserveAspectRatio="xMidYMid meet" clip-path="url(#espClip)" xlink:href="https://zaitronics.com.au/cdn/shop/files/1-10PCS-ESP32-C3-Development-Board-ESP32-C3-SuperMini-WiFi-4M-Bluetooth-For-Arduino_jpg.png?v=1721795578&amp;width=1445"/>
<image x="790" y="205" width="230" height="230" preserveAspectRatio="xMidYMid meet" clip-path="url(#cableClip)" xlink:href="https://cdn11.bigcommerce.com/s-xwx16vh8tc/images/stencil/1280x1280/products/445294/2859217/Tripp_Lite_by_Eaton_U428-C03-G2_USB_Type-C_to_USB_Type-A_Cable_MM_USB-IF_Certified_3_ft_-_3_ft_USB_Data_Transfer_Cable_for_Hard_-_U428-C03-G2_fleetnetwork_20250212204116__84280.1739476723.jpg?c=2"/>
<image x="1120" y="205" width="250" height="230" preserveAspectRatio="xMidYMid meet" clip-path="url(#headClip)" xlink:href="https://raw.githubusercontent.com/Ahmed-eskafi/c3-media-bridge/main/docs/images/mazda-android-head-unit.jpg"/>

<!-- labels -->
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="205" y="468" fill="#122033" font-size="22" font-weight="700">BLE MEDIA REMOTE</text>
 <text x="555" y="468" fill="#122033" font-size="22" font-weight="700">ESP32-C3</text>
 <text x="555" y="491" fill="#50657b" font-size="15">Super Mini board</text>
 <text x="905" y="468" fill="#122033" font-size="22" font-weight="700">USB DATA CABLE</text>
 <text x="905" y="491" fill="#50657b" font-size="15">USB Serial • 115200 baud</text>
 <text x="1245" y="468" fill="#122033" font-size="22" font-weight="700">ANDROID HEAD UNIT</text>
 <text x="1245" y="491" fill="#50657b" font-size="15">C3 Media Bridge app</text>
</g>

<!-- connections -->
<path d="M355 320H405" stroke="#52c8ff" stroke-width="6" marker-end="url(#arrow)"/>
<path d="M695 320H765" stroke="#52c8ff" stroke-width="6" marker-end="url(#arrow)"/>
<path d="M1035 320H1085" stroke="#52c8ff" stroke-width="6" marker-end="url(#arrow)"/>
